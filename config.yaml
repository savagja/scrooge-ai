# ════════════════════════════════════════════════════════════
# TRADING CONFIGURATION
# Adjust these values to tune strategy, risk, and behavior.
# No secrets here — all API keys live in .env
# ════════════════════════════════════════════════════════════

# ─── Account ─────────────────────────────────────────────────
initial_capital: 100          # Starting account size (for reference only)

# ─── Strategy Parameters ─────────────────────────────────────
poll_interval_ms: 240000       # Every 4 minutes — reduced from 2min to lower CPU/memory
watchlist: []                  # No seed watchlist — the strategist discovers tickers dynamically via broad market sweeps of the research DB and Yahoo movers.

discovery:
  enabled: true               # Yahoo movers/gainers/trending for broad market discovery
  max_discovered: 10          # How many extra tickers to surface via Yahoo
  refresh_interval_cycles: 3  # Re-discover every N cycles

# ─── Risk Parameters ──────────────────────────────────────────
# Safety rules only. Sizing, limits, and strategy are the agent's domain.
risk:
  stop_loss_pct: 0.03           # Hard stop: exit at -3% from entry
  trailing_stop_pct: 0.05       # Winners: exit if price drops 5% from peak (longs) or rises 5% from trough (shorts)
  green_threshold: 0.01        # Promotion threshold: +1% profit = activate trailing stop
  short_squeeze_threshold: 0.05 # Shorts: exit if price rises 5% intraday from entry

# ─── Signal Filters ───────────────────────────────────────────
signal:
  hold_minutes: 30              # Initial hold duration (metadata only — no time stop enforced. Agent holds as long as thesis is intact.)

# ─── Execution ────────────────────────────────────────────────
execution:
  dry_run: false                # Set to false for live/paper trading. Keep true for first deploy test.
  fractional_enabled: true    # Alpaca fractional shares (must stay true for small account)
  default_time_in_force: day    # day, ioc, fok

# ─── Data Sources ─────────────────────────────────────────────
data:
  edgar_enabled: true           # SEC EDGAR 8-K filings
  reddit_enabled: true          # Reddit mention velocity
  yahoo_discovery: true         # Yahoo Finance market movers for discovery
  volume_lookback_days: 20     # Days for relative volume calculation
  range_lookback_days: 20      # Days for range break calculation

# ─── LLM / Agent ─────────────────────────────────────────────
agent:
  thinking_level: medium      # off, minimal, low, medium, high, xhigh
  max_tool_calls_per_turn: 12   # Strategist needs: research + create_strategy + update_strategy per cycle
  enable_reflection: false       # Disabled — saves tokens. Manual reflect_on_performance still available

# ─── Strategist ────────────────────────────────────────────
strategist:
  enabled: true               # Set false to disable the strategist process entirely
  cycle_interval_ms: 720000     # Run strategist every ~12 min during market hours (every 6 trader cycles)
  pre_market_window_min: 30    # Start strategist N minutes before market open
  prune_stale_hours: 48        # Archive strategies with no updates in N hours
  purge_retained_days: 14      # Permanently delete stale/failed strategies after N days

# ─── Research Engine ──────────────────────────────────────────
research:
  enabled: true               # Set false to disable entirely (saves bandwidth/API calls)
  db_path: data/research.db   # SQLite database location
  raw_retention_days: 14       # Keep raw signal events for 14 days
  hourly_retention_days: 90    # Hourly aggregates for 90 days
  daily_retention_days: 365    # Daily aggregates for 365 days
  prune_interval_cycles: 60    # Prune old data every N research ticks
  fundamentals_refresh_hours: 24 # Refresh fundamentals every N hours